      "Close up portrait of a cyberpunk robotic woman with ornate golden filigree circuits and gentle violet eyes, studio lighting",
      "Hyperdetailed miniature diorama of a cozy Ghibli style bakery inside an overgrown giant oak tree"
    ];

    // ==========================================
    // Main App Component
    // ==========================================
    function App() {
      // Screen & Navigation
      const [currentScreen, setCurrentScreen] = useState('landing'); // 'landing' | 'app'
      const [activeTab, setActiveTab] = useState('text-to-image');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [mobileNavOpen, setMobileNavOpen] = useState(false);

      // Studio Controls State
      const [prompt, setPrompt] = useState("A colorful ethereal portrait of a celestial goddess with glowing pastel flowers and cosmic stardust");
      const [negativePrompt, setNegativePrompt] = useState("blurry, low quality, distorted, watermark, deformed anatomy, bad proportions");
      const [imageSize, setImageSize] = useState('1:1'); // '1:1' | '16:9' | '9:16'
      const [cfgScale, setCfgScale] = useState(7);
      const [steps, setSteps] = useState(30);
      const [seed, setSeed] = useState("");
      const [imageCount, setImageCount] = useState(4);
      const [selectedStyle, setSelectedStyle] = useState('Realistic');

      // Generation & Results State
      const [isGenerating, setIsGenerating] = useState(false);
      const [genProgress, setGenProgress] = useState(0);
      const [genStepText, setGenStepText] = useState("");
      const [results, setResults] = useState([]);
      const [favorites, setFavorites] = useState(new Set());
      const [history, setHistory] = useState([]);

      // Modals
      const [lightboxImage, setLightboxImage] = useState(null);
      const [isHelpOpen, setIsHelpOpen] = useState(false);
      const [isProOpen, setIsProOpen] = useState(false);
      const [copyToast, setCopyToast] = useState(false);

      const resultsRef = useRef(null);

      // Handle Surprise Me
      const handleSurpriseMe = () => {
        const rand = SURPRISE_PROMPTS[Math.floor(Math.random() * SURPRISE_PROMPTS.length)];
        setPrompt(rand);
      };

      // Toggle Favorite
      const toggleFavorite = (id, imgObj) => {
        setFavorites(prev => {
          const next = new Set(prev);
          if (next.has(id)) {
            next.delete(id);
          } else {
            next.add(id);
          }
          return next;
        });
      };

      // Generate Image Action
      const handleGenerate = () => {
        if (!prompt.trim() || isGenerating) return;

        setIsGenerating(true);
        setGenProgress(10);
        setGenStepText("Allocating GPU tensor buffers...");

        const stepsList = [
          { p: 28, text: "Applying prompt conditioning & CFG guidance..." },
          { p: 58, text: `Synthesizing ${steps} sampling steps in latent space...` },
          { p: 85, text: "Running VAE latent decoder..." },
          { p: 100, text: "Finalizing high-res render..." },
        ];

        let i = 0;
        const interval = setInterval(() => {
          if (i < stepsList.length) {
            setGenProgress(stepsList[i].p);
            setGenStepText(stepsList[i].text);
            i++;
          } else {
            clearInterval(interval);

            // Generate images
            const styleKey = selectedStyle.toLowerCase().replace(' ', '-');
            const pool = STYLE_IMAGE_POOLS[styleKey] || STYLE_IMAGE_POOLS['realistic'];
            const chosenSeed = seed.trim() ? seed.trim() : Math.floor(Math.random() * 999999 + 100000).toString();

            const newImages = Array.from({ length: imageCount }).map((_, idx) => {
              const url = pool[idx % pool.length] || pool[0];
              return {
                id: 'gen-' + Date.now() + '-' + idx,
                url: url,
                prompt: prompt,
                negativePrompt: negativePrompt,
                style: selectedStyle,
                seed: (parseInt(chosenSeed) + idx).toString(),
                size: imageSize,
                cfg: cfgScale,
                steps: steps,
                aspect: imageSize,
                createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              };
            });

            setResults(newImages);
            setHistory(prev => [
              {
                id: 'batch-' + Date.now(),
                prompt,
                style: selectedStyle,
                images: newImages,
                timestamp: 'Just now',
              },
              ...prev
            ]);

            setIsGenerating(false);
            setGenProgress(0);

            // Scroll to results
            setTimeout(() => {
              if (resultsRef.current) {
                resultsRef.current.scrollIntoView({ behavior: 'smooth' });
              }
            }, 100);
          }
        }, 380);
      };

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        setCopyToast(true);
        setTimeout(() => setCopyToast(false), 2000);
      };

      const triggerDownload = (img) => {
        const link = document.createElement('a');
        link.href = img.url;
        link.download = `VisionCrafter-${img.style.toLowerCase()}-${img.seed}.jpg`;
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // ==========================================
      // SCREEN 1: LANDING HERO
      // ==========================================
      if (currentScreen === 'landing') {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center px-4 py-12 relative overflow-hidden">
            {/* Top Badge */}
            <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white border border-purple-200 shadow-sm text-purple-600 text-sm font-medium mb-8 hover:border-purple-300 transition-all cursor-default">
              <Icon name="sparkles" size={16} className="text-purple-500 animate-pulse" />
              <span>Powered by Advanced Diffusion Models</span>
            </div>

            {/* Giant Title */}
            <h1 className="text-6xl md:text-7xl font-extrabold tracking-tight brand-gradient-text text-center mb-6 leading-tight">
              VisionCrafter AI
            </h1>

            {/* Gray Subtitle Paragraph */}
            <p className="max-w-2xl text-center text-[#6B6B80] text-base md:text-lg leading-relaxed mb-10 font-normal">
              VisionCrafter AI transforms your imagination into stunning AI-generated artwork using advanced diffusion models. Simply describe your vision, choose your preferred style, and let AI create breathtaking, high-quality images in seconds.
            </p>

            {/* Get Started Button */}
            <button
              onClick={() => setCurrentScreen('app')}
              className="group brand-gradient-bg brand-gradient-bg-hover text-white font-bold text-base px-9 py-4 rounded-2xl shadow-lg shadow-purple-300/60 hover:shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center gap-3 mb-16 cursor-pointer"
            >
              <Icon name="wand" size={20} className="group-hover:rotate-12 transition-transform duration-300" />
              <span>Get Started</span>
            </button>

            {/* Three Sample Art Thumbnails with Rotations (-6deg, 0deg, +6deg) */}
            <div className="flex items-center justify-center gap-4 md:gap-6 pt-4">
              {/* Card 1: Colorful painted face (-6deg) */}
              <div className="w-24 h-24 md:w-32 md:h-32 rounded-2xl overflow-hidden border-4 border-white shadow-xl shadow-purple-900/10 -rotate-6 hover:rotate-0 hover:scale-105 transition-all duration-300 cursor-pointer">
                <img
                  src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=400&q=80"
                  alt="Colorful painted face art"
                  className="w-full h-full object-cover"
                />
              </div>

              {/* Card 2: Purple/pink abstract wave (0deg) */}
              <div className="w-24 h-24 md:w-32 md:h-32 rounded-2xl overflow-hidden border-4 border-white shadow-xl shadow-purple-900/10 rotate-0 hover:scale-105 transition-all duration-300 cursor-pointer z-10">
                <img
                  src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=400&q=80"
                  alt="Purple pink abstract wave"
                  className="w-full h-full object-cover"
                />
              </div>

              {/* Card 3: Neon RGB keyboard (+6deg) */}
              <div className="w-24 h-24 md:w-32 md:h-32 rounded-2xl overflow-hidden border-4 border-white shadow-xl shadow-purple-900/10 rotate-6 hover:rotate-0 hover:scale-105 transition-all duration-300 cursor-pointer">
                <img
                  src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=400&q=80"
                  alt="Neon RGB illuminated keyboard"
                  className="w-full h-full object-cover"
                />
              </div>
            </div>

            {/* Subtle bottom note */}
            <p className="mt-14 text-xs text-gray-400 font-medium">
              Click "Get Started" to launch the interactive Text to Image studio
            </p>
          </div>
        );
      }

      // ==========================================
      // SCREEN 2: MAIN APP LAYOUT WITH SIDEBAR
      // ==========================================
      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: 'grid' },
        { id: 'text-to-image', label: 'Text to Image', icon: 'wand' },
        { id: 'image-to-image', label: 'Image to Image', icon: 'image' },
        { id: 'negative-prompt', label: 'Negative Prompt', icon: 'minusSquare' },
        { id: 'art-styles', label: 'Art Styles', icon: 'palette' },
        { id: 'history', label: 'Prompt History', icon: 'history' },
        { id: 'favorites', label: 'Favorites', icon: 'heart', badge: favorites.size > 0 ? favorites.size : null },
        { id: 'gallery', label: 'AI Gallery', icon: 'gallery' },
        { id: 'downloads', label: 'Downloads', icon: 'download' },
        { id: 'settings', label: 'Settings', icon: 'settings' },
      ];

      return (
        <div className="min-h-screen flex bg-transparent relative">
          {/* Toast Notification */}
          {copyToast && (
            <div className="fixed top-6 right-6 z-50 bg-[#1F1B2E] text-white px-4 py-2.5 rounded-xl shadow-xl flex items-center gap-2 text-sm font-medium animate-fade-in">
              <Icon name="check" size={16} className="text-emerald-400" />
              <span>Copied to clipboard!</span>
            </div>

          {/* ==========================================
              SIDEBAR
          =========================================== */}
          {/* Mobile Overlay */}
          {mobileNavOpen && (

              <nav className="px-3 py-2 space-y-1">

                  return (
                    <button
                      key={item.id}
                      onClick={() => {
                        setActiveTab(item.id);
                        setMobileNavOpen(false);

                      title={sidebarCollapsed ? item.label : undefined}
                      className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all ${
                        isActive

                      <Icon
                        name={item.icon}
                        size={19}
                        className={isActive ? 'text-purple-600' : 'text-gray-400 group-hover:text-gray-600'}

                      {!sidebarCollapsed && <span className="truncate">{item.label}</span>}
                      {!sidebarCollapsed && item.badge && (
                        <span className="ml-auto bg-purple-100 text-purple-700 text-xs px-2 py-0.5 rounded-full font-bold">
                          {item.badge}
                        </span>

                    </button>

              </nav>
            </div>

            {/* Sidebar Bottom Controls: Help & Collapse Chevron */}

              {sidebarCollapsed && (
                <button
                  onClick={() => setIsHelpOpen(true)}
                  className="w-10 h-10 rounded-xl hover:bg-purple-50 text-gray-400 hover:text-purple-600 flex items-center justify-center transition-colors"
                  title="Prompt Guide & Help"
                >
                  <Icon name="help" size={20} />
                </button>
              )}

              <button
                onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                className={`w-full py-2.5 rounded-xl bg-purple-50/60 hover:bg-purple-100/80 text-purple-600 flex items-center justify-center transition-all ${
                  sidebarCollapsed ? 'px-0' : 'px-3'
                }`}
                title={sidebarCollapsed ? "Expand sidebar" : "Collapse sidebar"}
              >
                {sidebarCollapsed ? (
                  <Icon name="chevronRight" size={18} />
                ) : (
                  <div className="flex items-center gap-2 text-xs font-semibold">
                    <Icon name="chevronLeft" size={16} />
                    <span>Collapse menu</span>
                  </div>
                )}
              </button>
            </div>
          </aside>

          {/* ==========================================
              MAIN CONTENT COLUMN
          =========================================== */}
          <main className="flex-1 flex flex-col min-w-0 pb-24">
            {/* Top Header */}
            <header className="sticky top-0 z-30 bg-white/70 backdrop-blur-md border-b border-[#EDE9FE]/80 px-6 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                {/* Mobile Menu Toggle Button */}
                <button
                  onClick={() => setMobileNavOpen(true)}
                  className="p-2 rounded-xl text-gray-500 hover:bg-purple-50 md:hidden"
                >
                  <Icon name="grid" size={22} />
                </button>

                <div>
                  <h2 className="text-xl md:text-2xl font-bold text-[#1F1B2E] tracking-tight">
                    {activeTab === 'text-to-image' && 'Create Your AI Artwork'}
                    {activeTab === 'dashboard' && 'Studio Dashboard'}
                    {activeTab === 'image-to-image' && 'Image to Image Synthesizer'}
                    {activeTab === 'negative-prompt' && 'Negative Prompt Builder'}
                    {activeTab === 'art-styles' && 'Art Styles Explorer'}
                    {activeTab === 'history' && 'Generation History'}
                    {activeTab === 'favorites' && 'Your Favorites'}
                    {activeTab === 'gallery' && 'Community AI Gallery'}
                    {activeTab === 'downloads' && 'Export & Downloads'}
                    {activeTab === 'settings' && 'Studio Preferences'}
                  </h2>
                  <p className="text-xs md:text-sm text-[#6B6B80]">
                    {activeTab === 'text-to-image' && 'Describe your vision and let AI bring it to life'}
                    {activeTab === 'dashboard' && 'Welcome back to your creative diffusion suite'}
                    {activeTab === 'image-to-image' && 'Transform existing images with style conditioning'}
                    {activeTab === 'negative-prompt' && 'Filter out artifacts, distortion, and unwanted elements'}
                    {activeTab === 'art-styles' && 'Browse all 16 fine-tuned visual aesthetics'}
                    {activeTab === 'history' && 'Review, remix and re-run all previous prompt batches'}
                    {activeTab === 'favorites' && 'Curate your finest generative masterpieces'}
                    {activeTab === 'gallery' && 'Get inspired by trending creations from the community'}
                    {activeTab === 'downloads' && 'High resolution lossless downloads and batch export'}
                    {activeTab === 'settings' && 'Configure default sampling, models, and interface'}
                  </p>
                </div>
              </div>

              {/* Right Pro Plan Pill Button */}
              <button
                onClick={() => setIsProOpen(true)}
                className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#F3EEFF] hover:bg-[#EAE1FE] text-purple-600 text-sm font-medium border border-purple-200/80 shadow-xs transition-all active:scale-95"
              >
                <Icon name="sparkles" size={15} className="text-purple-500" />
                <span>Pro Plan</span>
              </button>
            </header>

            {/* Main Content Area */}
            <div className="max-w-5xl w-full mx-auto px-4 md:px-8 py-6 space-y-6">

              {/* ----------------------------------------------------
                  VIEW: TEXT TO IMAGE (MAIN STUDIO)
              ----------------------------------------------------- */}
              {activeTab === 'text-to-image' && (
                <>
                  {/* Card 1: Prompt Card */}
                  <div className="bg-white rounded-3xl p-6 border border-[#EDE9FE]/80 shadow-soft-card space-y-5">
                    {/* Prompt input */}
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <label className="font-bold text-[#1F1B2E] text-sm">Prompt</label>
                        <button
                          type="button"
                          onClick={handleSurpriseMe}
                          className="inline-flex items-center gap-1.5 text-xs text-purple-600 hover:text-purple-700 font-semibold px-2.5 py-1 rounded-lg hover:bg-purple-50 transition-colors"
                        >
                          <Icon name="dices" size={14} />
                          <span>Surprise me</span>
                        </button>
                      </div>
                      <textarea
                        rows="3"
                        value={prompt}
                        onChange={(e) => setPrompt(e.target.value)}
                        placeholder="Describe the image you want to generate..."
                        className="w-full bg-[#F7F5FF] border border-[#DDD6FE] focus:border-purple-400 focus:ring-4 focus:ring-purple-200/40 rounded-2xl p-4 text-sm text-[#1F1B2E] placeholder-[#9CA3AF] outline-none transition-all resize-none font-normal"
                      />
                    </div>

                    {/* Negative prompt input */}
                    <div>
                      <label className="font-bold text-[#1F1B2E] text-sm flex items-center gap-2 mb-2">
                        <span>Negative Prompt</span>
                        <span className="font-normal text-[#6B6B80] text-xs">(what to avoid)</span>
                      </label>
                      <textarea
                        rows="2"
                        value={negativePrompt}
                        onChange={(e) => setNegativePrompt(e.target.value)}
                        placeholder="blurry, low quality, distorted, watermark..."
                        className="w-full bg-[#FFF5F7] border border-[#FBCFE8] focus:border-pink-400 focus:ring-4 focus:ring-pink-200/40 rounded-2xl p-4 text-sm text-[#1F1B2E] placeholder-[#9CA3AF] outline-none transition-all resize-none font-normal"
                      />
                    </div>
                  </div>

                  {/* Card 2: Settings Card (4-column grid) */}
                  <div className="bg-white rounded-3xl p-6 border border-[#EDE9FE]/80 shadow-soft-card">
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 items-start">
                      
                      {/* Col 1: Image Size */}
                      <div>
                        <span className="block font-bold text-[#1F1B2E] text-xs mb-3">Image Size</span>
                        <div className="flex items-center gap-2">
                          {['1:1', '16:9', '9:16'].map((sz) => {
                            const isSelected = imageSize === sz;
                            return (
                              <button
                                key={sz}
                                type="button"
                                onClick={() => setImageSize(sz)}
                                className={`flex-1 py-2 text-xs font-semibold rounded-xl transition-all ${
                                  isSelected
                                    ? 'brand-gradient-bg text-white shadow-xs'
                                    : 'bg-[#F7F5FF] text-[#6B6B80] hover:text-purple-600 border border-[#DDD6FE]/70'
                                }`}
                              >
                                {sz}
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      {/* Col 2: CFG Scale */}
                      <div>
                        <div className="flex items-center justify-between mb-2">
                          <span className="font-bold text-[#1F1B2E] text-xs">
                            CFG Scale <span className="text-purple-600 font-bold">{cfgScale}</span>
                          </span>
                        </div>
                        <input
                          type="range"
                          min="1"
                          max="20"

                      {/* Col 3: Steps */}

                        <input
                          type="range"
                          min="10"
                          max="100"
                          step="1"

                        />

                      {/* Col 4: Seed (optional) & Images */}
                      <div className="space-y-3">
                        <div>
                          <label className="block font-bold text-[#1F1B2E] text-xs mb-1.5">Seed (optional)</label>
                          <input

                            value={seed}

                      <select className="w-full p-3 bg-[#F7F5FF] rounded-2xl border border-purple-200 text-xs font-medium">
                        <option>Stable Diffusion XL Turbo (Lightning Speed)</option>
                        <option>Stable Diffusion 3 Medium (Ultra Detail)</option>
                        <option>Flux.1 Dev (Photorealism Focus)</option>
                      </select>
                    </div>
                    <div>
                      <label className="font-bold text-xs text-[#1F1B2E] block mb-1">Color Theme</label>
                      <div className="flex items-center gap-3">
                        <button className="px-4 py-2 rounded-xl brand-gradient-bg text-white text-xs font-bold">
                          Light Glassmorphism (Default)
                        </button>
                        <button className="px-4 py-2 rounded-xl bg-purple-50 text-purple-700 text-xs font-medium border border-purple-200">
                          Dark Mode (Coming Soon)
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* ==========================================
              FLOATING DARK CIRCULAR HELP "?" BUTTON
          =========================================== */}
          <button
            type="button"
            onClick={() => setIsHelpOpen(true)}
            className="fixed bottom-6 right-6 w-11 h-11 rounded-full bg-[#1F1B2E] text-white flex items-center justify-center font-bold text-base shadow-xl hover:scale-105 active:scale-95 transition-all z-50 cursor-pointer"
            title="Help & Prompting Guide"
          >
            ?
          </button>

          {/* ==========================================
              MODAL: HELP / PROMPT GUIDE
          =========================================== */}
          {isHelpOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-lg w-full border border-purple-100 shadow-2xl space-y-4 animate-scale-up">
                <div className="flex items-center justify-between border-b border-gray-100 pb-3">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-xl brand-gradient-bg text-white flex items-center justify-center font-bold text-sm">
                      ?
                    </div>
                    <h3 className="font-bold text-[#1F1B2E] text-base">VisionCrafter AI Guide</h3>
                  </div>
                  <button
                    onClick={() => setIsHelpOpen(false)}
                    className="p-1 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="space-y-3 text-xs text-[#6B6B80] leading-relaxed">
                  <div>
                    <strong className="text-[#1F1B2E] block mb-0.5 font-bold">CFG Scale (Classifier-Free Guidance)</strong>
                    <span>Controls how closely the image adheres to your text prompt. Values between 6 and 9 offer the optimal balance of creativity and fidelity.</span>
                  </div>
                  <div>
                    <strong className="text-[#1F1B2E] block mb-0.5 font-bold">Sampling Steps</strong>
                    <span>Determines the number of iterative denoising steps. 25-35 steps produce sharp details without slowing down generation.</span>
                  </div>
                  <div>
                    <strong className="text-[#1F1B2E] block mb-0.5 font-bold">Negative Prompting</strong>
                    <span>Instructs the neural network on what visual flaws, distortions, or unwanted elements to penalize during diffusion.</span>
                  </div>
                  <div>
                    <strong className="text-[#1F1B2E] block mb-0.5 font-bold">Seed Reproducibility</strong>
                    <span>Locking a specific numerical seed allows you to regenerate the identical composition while tuning other parameters like CFG.</span>
                  </div>
                </div>

                <button
                  onClick={() => setIsHelpOpen(false)}
                  className="w-full py-2.5 brand-gradient-bg text-white font-bold rounded-xl text-xs shadow-md"
                >
                  Got it, thanks!
                </button>
              </div>
            </div>
          )}

          {/* ==========================================
              MODAL: PRO PLAN UPGRADE
          =========================================== */}
          {isProOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full border border-purple-100 shadow-2xl space-y-4 animate-scale-up text-center">
                <div className="w-12 h-12 rounded-2xl brand-gradient-bg text-white flex items-center justify-center mx-auto shadow-md">
                  <Icon name="sparkles" size={24} />
                </div>
                <h3 className="text-xl font-bold text-[#1F1B2E]">VisionCrafter Pro</h3>
                <p className="text-xs text-[#6B6B80]">Supercharge your diffusion workflow with enterprise-grade GPU instances.</p>

                <div className="bg-[#F7F5FF] rounded-2xl p-4 text-left space-y-2 text-xs">
                  <div className="flex items-center gap-2 text-[#1F1B2E]">
                    <Icon name="check" size={14} className="text-purple-600 font-bold" />
                    <span>Unlimited daily image generations</span>
                  </div>
                  <div className="flex items-center gap-2 text-[#1F1B2E]">
                    <Icon name="check" size={14} className="text-purple-600 font-bold" />
                    <span>Dedicated H100 GPU priority inference</span>
                  </div>
                  <div className="flex items-center gap-2 text-[#1F1B2E]">
                    <Icon name="check" size={14} className="text-purple-600 font-bold" />
                    <span>Lossless 4K neural upscaling & commercial license</span>
                  </div>
                </div>

                <div className="pt-2 flex items-center gap-2">
                  <button
                    onClick={() => setIsProOpen(false)}
                    className="flex-1 py-2.5 brand-gradient-bg text-white font-bold rounded-xl text-xs shadow-md"
                  >
                    Upgrade for $19/mo
                  </button>
                  <button
                    onClick={() => setIsProOpen(false)}
                    className="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-xl text-xs"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ==========================================
              MODAL: LIGHTBOX FULLSCREEN PREVIEW
          =========================================== */}
          {lightboxImage && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="max-w-4xl w-full bg-[#1F1B2E] text-white rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row">
                {/* Large Image Preview */}
                <div className="flex-1 bg-black flex items-center justify-center p-4">
                  <img
                    src={lightboxImage.url}
                    alt={lightboxImage.prompt}
                    className="max-h-[70vh] w-auto object-contain rounded-xl"
                  />
                </div>

                {/* Info Sidebar in Modal */}
                <div className="w-full md:w-80 p-6 flex flex-col justify-between space-y-4">
                  <div>
                    <div className="flex items-center justify-between mb-4">
                      <span className="text-xs uppercase font-bold text-purple-400">{lightboxImage.style} Style</span>
                      <button
                        onClick={() => setLightboxImage(null)}
                        className="text-gray-400 hover:text-white p-1"
                      >
                        <Icon name="x" size={20} />
                      </button>
                    </div>

                    <p className="text-xs font-semibold text-gray-200 mb-4 leading-relaxed">
                      "{lightboxImage.prompt}"
                    </p>

                    <div className="space-y-2 text-[11px] text-gray-400 border-t border-white/10 pt-3">
                      <div className="flex justify-between">
                        <span>Seed:</span>
                        <span className="text-white font-mono">{lightboxImage.seed}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>CFG Scale:</span>
                        <span className="text-white">{lightboxImage.cfg}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>Sampling Steps:</span>
                        <span className="text-white">{lightboxImage.steps}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>Aspect Ratio:</span>
                        <span className="text-white">{lightboxImage.aspect}</span>
                      </div>
                    </div>
                  </div>

                  <div className="space-y-2 pt-2">
                    <button
                      onClick={() => copyToClipboard(lightboxImage.prompt)}
                      className="w-full py-2 bg-white/10 hover:bg-white/20 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-colors"
                    >
                      <Icon name="copy" size={14} />
                      <span>Copy Prompt</span>
                    </button>
                    <button
                      onClick={() => triggerDownload(lightboxImage)}
                      className="w-full py-2.5 brand-gradient-bg text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow-md"
                    >
                      <Icon name="download" size={14} />
                      <span>Download Artwork</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
